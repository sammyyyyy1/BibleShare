name: BibleShare
options:
  bundleIdPrefix: com.bibleshare
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Fill in your Apple Developer Team ID for on-device builds (simulator builds don't need it).
    DEVELOPMENT_TEAM: ""

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  BibleShare:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Models
      - path: Views
      - path: ViewModels
      - path: Services
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bibleshare.app
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: Supabase
        product: Supabase

  BibleShareTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BibleShareTests
    dependencies:
      - target: BibleShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bibleshare.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"

schemes:
  BibleShare:
    build:
      targets:
        BibleShare: all
    test:
      targets:
        - BibleShareTests
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
